<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
    
     <fieldset>
      <legend>Personal info</legend>
    <label for="Firstname">Firstname:</label><br>
    <input type="text" id="Firstname" name="Firstname" value="John" >
<br>
    <label for="Surname">Surname:</label><br>
    <input type="text" id="Surname" name="Surname"><br>

    <label for="Email">Email:</label><br>
    <input type="email" id="Email" name="Email" size="40" required><br>

    <label for="Password">Password:</label><br>
    <input type="password" id="Password" name="Password" placeholder="Password">
     <br>
     <label for="Gender">Gender:</label>
      <br>
     <input type="radio" id="male" value="male" name="Gender">
     <label for="male">Male</label>
     <br>
     <input type="radio" id="female" value="female" name="Gender">
     <label for="female">female</label><br>
 
     <label for="hobbies">Hobbies:</label>
     <br>
     <input type="checkbox" id="gaming" name="gaming" value="gaming">
     <label for="gaming">Gaming</label>
     <br>
     <input type="checkbox" id="football" name="football" value="football">
     <label for="football">Football</label>
     <br>
     <input type="checkbox" id="swimming" name="swimming" value="swimming">
     <label for="swimming">Swimming</label><br>
     <label for="pet">Choose a pet:</label>
     <select name="pet" id="pet">
         <option value="Dog">Dog</option>
         <option value="Cat">Cat</option>
         <option value="Parrot">Parrot</option>
     </select><br><br>

     <textarea name="message" id="message" rows="10" cols="20" maxlength="50"></textarea>
     <br>
     <input type="submit" name="submit" id="sumbit">


    </fieldset>

     </form>

   
</body>


</html>
